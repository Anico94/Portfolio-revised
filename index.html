<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181d27" />
    <!-- Applies a saved light-mode choice before first paint, so returning
         visitors never see a flash of the dark theme. Dark is the default, so
         there is nothing to do when no choice has been stored. The 'theme' key
         must stay in sync with src/hooks/useTheme.ts. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light')
          document.documentElement.dataset.theme = 'light'
      } catch {}
    </script>
    <!-- TODO: replace with your name and a one-line description. -->
    <meta
      name="description"
      content="Portfolio of Your Name — full-stack developer. Selected projects, tech stack, and a user manual for working together."
    />
    <title>Your Name — Full-Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
